<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Current Location</title>
</head>
<body>

    <h2>Current Location</h2>

    <button type="button" onclick="getLocation()">Get Location</button>

    <p id="result"></p>

    <script>

       /**
 * Fetches the user's current geographical location using the Browser Geolocation API.
 *
 * Steps:
 * 1. Checks whether the browser supports Geolocation.
 * 2. Requests the user's permission to access their location.
 * 3. On success:
 *    - Retrieves the latitude and longitude.
 *    - Displays the coordinates on the page.
 *    - Logs the coordinates to the browser console.
 * 4. On failure:
 *    - Displays the error message (e.g., permission denied, location unavailable).
 * 5. Uses high accuracy mode (GPS when available) for more precise coordinates.
 */


 function getLocation() {

            if (!navigator.geolocation) {
                alert("Geolocation is not supported.");
                return;
            }

            navigator.geolocation.getCurrentPosition(

                (position) => {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    document.getElementById("result").innerHTML = `
                        Latitude : ${latitude}<br>
                        Longitude : ${longitude}
                    `;

                    console.log({
                        latitude,
                        longitude
                    });

                },

                (error) => {
                    alert(error.message);
                },

                {
                    enableHighAccuracy: true
                }

            );

        }

    </script>

</body>
</html>
